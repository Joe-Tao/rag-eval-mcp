[project]
name = "rag-eval-mcp"
version = "0.1.0"
description = "Hybrid retrieval over CUAD contracts with a retrieval eval harness and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Real models. Kept optional so tests and CI smoke runs don't need torch.
models = ["sentence-transformers>=2.7"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
